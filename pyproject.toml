[project]
name = "ai-coach"
version = "0.1.0"
description = "Local-first conversational AI coach (VAD -> STT -> LLM -> streaming TTS) for Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20",
    "fastembed>=0.5",
    "mlx-audio==0.5.3",
    "misaki==0.9.4",
    "spacy>=3.8,<3.9",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
    "parakeet-mlx>=0.5",
    "huggingface-hub>=0.25",
    "soundfile>=0.12",
    "trafilatura>=1.9",
    "youtube-transcript-api>=0.6",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pipecat-ai[webrtc,websocket]>=1.10",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false
